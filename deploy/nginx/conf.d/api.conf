# Proxy TLS para a API Hyperf.
#
# Certificados (Let's Encrypt no host, exemplo):
#   sudo certbot certonly --standalone -d api.seudominio.com
#   sudo cp /etc/letsencrypt/live/api.seudominio.com/fullchain.pem deploy/nginx/certs/fullchain.pem
#   sudo cp /etc/letsencrypt/live/api.seudominio.com/privkey.pem deploy/nginx/certs/privkey.pem
#   sudo chmod 644 deploy/nginx/certs/fullchain.pem
#   sudo chmod 600 deploy/nginx/certs/privkey.pem
#
# Sem certificados ainda: comente o bloco "listen 443" e o redirect, e sirva só em :80
# (apenas para smoke test — não use HTTP em produção pública).

server {
    listen 80;
    listen [::]:80;
    server_name api.seudominio.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.seudominio.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Uploads / payloads JSON grandes
    client_max_body_size 128M;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Swoole / long requests
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        proxy_pass http://hyperf_api;
    }

    location = /api/v1/health/live {
        proxy_pass http://hyperf_api;
        access_log off;
    }

    location = /api/v1/health/ready {
        proxy_pass http://hyperf_api;
        access_log off;
    }
}
