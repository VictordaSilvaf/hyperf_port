# HTTP only — TLS fica no Caddy (já na VPS nas portas 80/443).
# Compose publica host 8080 → container 80 (HTTP_PUBLISH_PORT).
#
# No Caddyfile do host:
#   api.victorsf.com {
#       reverse_proxy 127.0.0.1:8080
#   }

server {
    listen 80;
    listen [::]:80;
    server_name api.victorsf.com;

    client_max_body_size 128M;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        proxy_pass http://hyperf_api;
    }

    location = /api/v1/health/live {
        proxy_pass http://hyperf_api;
        access_log off;
    }

    location = /api/v1/health/ready {
        proxy_pass http://hyperf_api;
        access_log off;
    }
}
