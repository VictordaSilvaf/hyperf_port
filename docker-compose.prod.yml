# Produção — VPS + Docker Compose
# Uso:
#   cp .env.production.example .env.production   # preencher secrets
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#   docker compose --env-file .env.production -f docker-compose.prod.yml exec api php bin/hyperf.php migrate
#
# Só 80/443 no host. Postgres, Redis e API (9501) ficam na rede interna.

services:
  api:
    container_name: victordev-api
    build:
      context: .
      dockerfile: Dockerfile
      args:
        timezone: America/Sao_Paulo
    image: victordev-api:prod
    env_file:
      - path: .env.production
        required: true
    environment:
      APP_ENV: prod
      APP_DEBUG: "false"
      SWAGGER_ENABLE: "false"
      SCAN_CACHEABLE: "true"
      DB_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - "9501"
    healthcheck:
      test:
        [
          "CMD",
          "php",
          "-r",
          "$$c=@file_get_contents('http://127.0.0.1:9501/api/v1/health/ready'); exit($$c===false?1:0);",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    networks:
      - prod

  postgres:
    container_name: victordev-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USERNAME:-victordev}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
      POSTGRES_DB: ${DB_DATABASE:-victordev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME:-victordev} -d ${DB_DATABASE:-victordev}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - prod

  redis:
    container_name: victordev-redis
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    networks:
      - prod

  nginx:
    container_name: victordev-nginx
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PUBLISH_PORT:-80}:80"
      - "${HTTPS_PUBLISH_PORT:-443}:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - prod

networks:
  prod:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
