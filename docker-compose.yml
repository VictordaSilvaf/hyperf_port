services:
  hyperf-skeleton:
    container_name: hyperf-skeleton
    image: hyperf-skeleton
    build:
      context: .
      dockerfile: dev.Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    volumes:
      - ./:/opt/www
    ports:
      - "${API_PORT:-9501}:9501"
    env_file:
      - .env
    environment:
      # Garante leitura do .env montado; sobrescreve só se definido no compose
      SCAN_CACHEABLE: ${SCAN_CACHEABLE:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mailpit:
        condition: service_started
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    networks:
      - hyperf-net

  minio:
    image: minio/minio:latest
    container_name: hyperf-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_PUBLISH_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PUBLISH_PORT:-9001}:9001"
    networks:
      - hyperf-net

  minio-init:
    image: minio/mc:latest
    container_name: hyperf-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} 2>/dev/null; do sleep 1; done;
      mc mb local/$${MINIO_BUCKET} --ignore-existing;
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_ACCESS_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-victorsf}
    networks:
      - hyperf-net

  redis:
    container_name: hyperf-redis
    image: redis:7-alpine
    ports:
      # Porta no host (acesso externo). Dentro da rede Docker o Redis escuta sempre 6379.
      - "${REDIS_PUBLISH_PORT:-6379}:6379"
    networks:
      - hyperf-net

  postgres:
    container_name: hyperf-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_DATABASE:-victordev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${DB_PUBLISH_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-victordev}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - hyperf-net

  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    ports:
      - "${MAIL_WEB_PORT:-8025}:8025"
      - "${MAIL_SMTP_PORT:-1025}:1025"
    networks:
      - hyperf-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: hyperf-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@victordev.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    ports:
      - "${PGADMIN_PUBLISH_PORT:-5050}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hyperf-net

networks:
  hyperf-net:
    driver: bridge
volumes:
  postgres-data:
  minio-data:
  pgadmin-data:
