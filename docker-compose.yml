services:
  hyperf-skeleton:
    container_name: hyperf-skeleton
    image: hyperf-skeleton
    build:
      context: .
      dockerfile: dev.Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    volumes:
      - ./:/opt/www
    ports:
      - "${API_PORT:-9501}:9501"
    env_file:
      - .env
    environment:
      # Garante leitura do .env montado; sobrescreve só se definido no compose
      SCAN_CACHEABLE: ${SCAN_CACHEABLE:-false}
    depends_on:
      - redis
      - mysql
      - mailpit
    networks:
      - hyperf-net

  redis:
    container_name: hyperf-redis
    image: redis:7-alpine
    ports:
      # Porta no host (acesso externo). Dentro da rede Docker o Redis escuta sempre 6379.
      - "${REDIS_PUBLISH_PORT:-6379}:6379"
    networks:
      - hyperf-net

  mysql:
    container_name: hyperf-mysql
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-victordev}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "${DB_PUBLISH_PORT:-3306}:3306"
    networks:
      - hyperf-net

  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    ports:
      - "${MAIL_WEB_PORT:-8025}:8025"
      - "${MAIL_SMTP_PORT:-1025}:1025"
    networks:
      - hyperf-net

networks:
  hyperf-net:
    driver: bridge
volumes:
  mysql-data:
