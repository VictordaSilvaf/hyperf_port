services:
  hyperf-skeleton:
    container_name: hyperf-skeleton
    image: hyperf-skeleton
    build:
      context: .
      dockerfile: dev.Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    volumes:
      - ./:/opt/www
    ports:
      - 9501:9501
    environment:
      - APP_ENV=dev
      - SCAN_CACHEABLE=false
    depends_on:
      - redis
      - mysql
      - mailpit
    networks:
      - hyperf-net

  redis:
    container_name: hyperf-redis
    image: redis:7-alpine
    ports:
      - 6379:6379
    networks:
      - hyperf-net

  mysql:
    container_name: hyperf-mysql
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      # Base criada na primeira subida do volume; alinhe com DB_DATABASE no .env
      MYSQL_DATABASE: victordev
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - 3306:3306
    networks:
      - hyperf-net

  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    ports:
      - 8025:8025
      - 1025:1025
    networks:
      - hyperf-net

networks:
  hyperf-net:
    driver: bridge
volumes:
  mysql-data:
